{% extends "base.html" %}

{% block titulo %}Renomear Loja{% endblock %}

{% block conteudo %}
<section class="cartao">
  <h1>Renomear Loja</h1>
  {% if erro %}<p class="erro" role="alert"><strong>Não foi possível salvar:</strong> {{ erro }}</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    <div class="campo">
      <label for="nome">Nome da Loja</label>
      <input id="nome" name="nome" type="text" value="{{ nome }}" maxlength="200">
    </div>
    <div class="acoes">
      <button class="botao botao--primario" type="submit">Salvar</button>
      <a class="botao botao--secundario" href="{% url 'inicio' %}">Cancelar</a>
    </div>
  </form>
</section>
{% endblock %}
