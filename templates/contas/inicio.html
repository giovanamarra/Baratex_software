{% extends "base.html" %}

{% block titulo %}As minhas Lojas{% endblock %}

{% block conteudo %}
<section class="cartao">
  <h1>As minhas Lojas</h1>
  <ul class="lista">
    {% for loja in lojas %}
    <li class="lista__item">
      <span>{{ loja.nome }}</span>
      <a class="botao botao--secundario" href="{% url 'editar_loja' loja.pk %}">Renomear</a>
    </li>
    {% empty %}
    <li class="lista__item texto-secundario">Nenhuma Loja cadastrada para você. Peça ao responsável pela instalação.</li>
    {% endfor %}
  </ul>
</section>
{% endblock %}
