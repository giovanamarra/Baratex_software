<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Comparador de Catálogos{% endblock %} · Baratex</title>
</head>
<body>
  {% if user.is_authenticated %}
  <nav>
    <a href="{% url 'inicio' %}">As minhas Lojas</a>
    <a href="{% url 'fornecedores' %}">Fornecedores</a>
    <form method="post" action="{% url 'sair' %}">
      {% csrf_token %}
      <button type="submit">Sair</button>
    </form>
  </nav>
  {% endif %}
  <main>
    {% block conteudo %}{% endblock %}
  </main>
</body>
</html>
